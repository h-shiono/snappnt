# Same as navic_s_esp32c61_aliasing_none.yaml, but the stream is low-pass filtered to the
# 4 MHz output band (analog band 20 MHz) before every 20th sample is kept (issue #3).
name: navic_s_esp32c61_aliasing_ideal_b20
signal: navic_s_sps
seed: 3
receiver:
  device: esp32c61
  sample_rate_hz: 4000000
  n_samples: 16384
  clock_offset_ppm: -8.0
  generate_rate_hz: 80000000
  analog_bandwidth_hz: 20000000
  decimation: {factor: 20, method: ideal}
satellites:
  - {prn: 10, cn0_dbhz: 42, doppler_hz: 0, code_phase_chips: 55.0}
