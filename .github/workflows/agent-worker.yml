# Worker agent: implements issues one step at a time (see docs/development/automation.md).
#
# Disabled unless the repository variable AGENTS_ENABLED is "true". Setting it to anything else
# stops both agents at the next event (kill switch).
#
# Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN  from `claude setup-token` (runs on the maintainer's Claude plan)
#   AGENT_GH_TOKEN           fine-grained personal access token for this repository only.
#                            A PAT (not GITHUB_TOKEN) is needed so that labels, comments and
#                            pushes made by one agent trigger the other agent and CI.
name: agent-worker

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  schedule:
    - cron: "40 * * * *" # hourly fallback, 30 minutes after the orchestrator's fallback
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-worker
  cancel-in-progress: false

jobs:
  worker:
    if: >-
      vars.AGENTS_ENABLED == 'true' && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issues' &&
          (github.event.label.name == 'status:ready' ||
           github.event.label.name == 'status:plan-approved')) ||
        (github.event_name == 'issue_comment' &&
          startsWith(github.event.comment.body, '**[orchestrator]**')) ||
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.comment.user.login == github.repository_owner &&
          !startsWith(github.event.comment.body, '**[')) ||
        (github.event_name == 'pull_request_review_comment' &&
          (startsWith(github.event.comment.body, '**[orchestrator]**') ||
           (github.event.comment.user.login == github.repository_owner &&
            !startsWith(github.event.comment.body, '**[')))) ||
        (github.event_name == 'pull_request_review' &&
          github.event.review.user.login == 'greptile-apps[bot]')
      )
    runs-on: ubuntu-latest
    # GitHub stops the job after this many minutes and nothing unpushed survives. The worker
    # is told the start time and the limit (see the prompt) and must push before it.
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.AGENT_GH_TOKEN }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Record start time
        run: echo "JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Install
        run: python -m pip install -e ".[dev,docs]"
      - uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GH_TOKEN }}
          # The action sets the git author itself (default claude[bot]). Commits are made on the
          # maintainer's behalf and signed off by them, so author them as the owner's noreply
          # address: <owner id>+<owner>@users.noreply.github.com.
          bot_name: ${{ github.repository_owner }}
          bot_id: ${{ github.repository_owner_id }}
          allowed_bots: "greptile-apps[bot]"
          prompt: |
            Read .github/agents/worker.md and follow it.
            This run was triggered by: ${{ github.event_name }}
            Issue or pull request number from the event (may be empty): ${{ github.event.issue.number || github.event.pull_request.number }}
            Repository owner (the maintainer's account): ${{ github.repository_owner }}
            This job started at ${{ env.JOB_STARTED_AT }} (UTC) and is stopped by GitHub 120 minutes later.
          claude_args: >-
            --max-turns 120
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,TodoWrite"
            --disallowedTools "Bash(hackrf_transfer:*),Bash(tx_samples_from_file:*),Bash(uhd_siggen:*),Bash(git push origin main:*),Bash(git push origin HEAD:main:*),Bash(git push --force:*),Bash(git push -f:*),Bash(gh pr merge:*),Bash(gh issue close:*),Bash(gh repo:*),Bash(gh secret:*),Bash(gh variable:*)"
