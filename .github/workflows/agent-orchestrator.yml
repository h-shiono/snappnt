# Orchestrator agent: approves plans, reviews and merges `auto` pull requests
# (see docs/development/automation.md and docs/development/orchestration.md).
#
# Disabled unless the repository variable AGENTS_ENABLED is "true" (kill switch).
# Secrets: CLAUDE_CODE_OAUTH_TOKEN and AGENT_GH_TOKEN, as described in agent-worker.yml.
name: agent-orchestrator

on:
  issue_comment:
    # `edited` is for Greptile's summary comment: when a review has no new findings, Greptile
    # only edits that comment (no pull request review is submitted), so nothing else would
    # start the orchestrator to merge.
    types: [created, edited]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_run:
    workflows: [ci]
    types: [completed]
  schedule:
    - cron: "10 * * * *" # hourly fallback
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-orchestrator
  cancel-in-progress: false

jobs:
  orchestrator:
    if: >-
      vars.AGENTS_ENABLED == 'true' && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          startsWith(github.event.comment.body, '**[worker]**')) ||
        (github.event_name == 'issue_comment' &&
          github.event.action == 'created' &&
          github.event.comment.user.login == github.repository_owner &&
          !startsWith(github.event.comment.body, '**[')) ||
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.comment.user.login == 'greptile-apps[bot]' &&
          contains(github.event.comment.body, 'greptile_summary') &&
          contains(github.event.comment.body, 'Last reviewed commit')) ||
        (github.event_name == 'pull_request_review_comment' &&
          (startsWith(github.event.comment.body, '**[worker]**') ||
           (github.event.comment.user.login == github.repository_owner &&
            !startsWith(github.event.comment.body, '**[')))) ||
        (github.event_name == 'pull_request_review' &&
          github.event.review.user.login == 'greptile-apps[bot]') ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'pull_request')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.AGENT_GH_TOKEN }}
    steps:
      # The orchestrator reads the rulebook from main and uses GitHub data only. It keeps no git
      # credentials and never checks out pull request code; CI runs that code without a token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104 # v1.0.238
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_GH_TOKEN }}
          allowed_bots: "greptile-apps[bot]"
          prompt: |
            Read .github/agents/orchestrator.md and follow it.
            This run was triggered by: ${{ github.event_name }}
            Issue or pull request number from the event (may be empty): ${{ github.event.issue.number || github.event.pull_request.number }}
            Repository owner (the maintainer's account): ${{ github.repository_owner }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Bash,Read,Glob,Grep,TodoWrite"
            --disallowedTools "Write,Edit,Bash(gh pr checkout:*),Bash(git fetch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git pull:*),Bash(pip:*),Bash(uv:*),Bash(pytest:*),Bash(hackrf_transfer:*),Bash(tx_samples_from_file:*),Bash(uhd_siggen:*),Bash(git push:*),Bash(git commit:*),Bash(gh issue close:*),Bash(gh repo:*),Bash(gh secret:*),Bash(gh variable:*)"
