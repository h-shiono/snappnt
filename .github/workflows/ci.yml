name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra sky
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Public-safety check
        run: uv run python tools/check_public_safety.py
      - name: ICD checks (spreading codes against printed tables)
        run: uv run pytest -m icd -q
      - name: Loopback (simulator -> acquisition -> truth)
        run: uv run pytest -m loopback -q
      - name: All tests
        run: uv run pytest -q
      - name: CLI smoke test
        run: |
          uv run snappnt info
          uv run snappnt sim scenarios/navic_s_esp32c3.yaml -o out/ci_c3
          uv run snappnt acquire out/ci_c3 --prn 10 --freq-span 40000

  # Builds the sdist, then the wheel from that sdist (the default of `uv build`), installs the
  # wheel into a clean virtual environment and runs the installed command from outside the
  # source tree. This catches files that the package reads at run time but the wheel lacks.
  # .github/workflows/publish.yml runs the same check on the files it uploads to PyPI.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build -o dist
      - name: Install the wheel into a clean environment and run it
        run: |
          venv="$RUNNER_TEMP/wheel-venv"
          uv venv "$venv"
          uv pip install --python "$venv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          "$venv/bin/python" -c "import pathlib, snappnt, sys; p = pathlib.Path(snappnt.__file__).resolve(); print(p); sys.exit(not p.is_relative_to(pathlib.Path(sys.prefix).resolve()))"
          "$venv/bin/snappnt" info
          "$venv/bin/snappnt" sim "$GITHUB_WORKSPACE/scenarios/navic_s_esp32c3.yaml" -o wheel_c3
          "$venv/bin/snappnt" acquire wheel_c3 --prn 10 --freq-span 40000

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Build documentation (strict)
        run: uv run mkdocs build --strict

  # Static check of every file in .github/workflows/: expression syntax and types, the
  # properties of contexts such as `github`, action inputs, and shell scripts in `run:` (with
  # the shellcheck that ubuntu-latest provides). It does not check the names of webhook payload
  # properties under `github.event`; tests/test_workflow_event_paths.py does.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install actionlint
        # Pinned by version and by the SHA-256 listed in the release's
        # actionlint_<version>_checksums.txt; update both together.
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: Check workflow files
        run: |
          "$RUNNER_TEMP/actionlint" -color
