name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra sky
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Public-safety check
        run: uv run python tools/check_public_safety.py
      - name: ICD checks (spreading codes against printed tables)
        run: uv run pytest -m icd -q
      - name: Loopback (simulator -> acquisition -> truth)
        run: uv run pytest -m loopback -q
      - name: All tests
        run: uv run pytest -q
      - name: CLI smoke test
        run: |
          uv run snappnt info
          uv run snappnt sim scenarios/navic_s_esp32c3.yaml -o out/ci_c3
          uv run snappnt acquire out/ci_c3 --prn 10 --freq-span 40000

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Build documentation (strict)
        run: uv run mkdocs build --strict
