# ESP32-C3 via ESP-SDR (e.g. Seeed XIAO ESP32C3: u.FL wired straight to LNA_IN, no RF switch)
name: esp32c3
kind: espsdr
role: receiver
tune_range_hz: [2100000000, 2800000000]   # "tuning attempts"; PLL lock not guaranteed off Wi-Fi centres
sample_rates_sps: [80000000]
adc_bits: 10
analog_bandwidth_hz: [14000000, 62000000]
max_capture_samples: 16380   # measured: INFO reports 16380, CAP20 16381 -> ERR command (docs/results/esp32c3-bench-no-rf.md)
transport: "USB Serial/JTAG (native)"
source: "ESPARGOS esp-sdr README and docs/rx-controls.md (2026-09)"
